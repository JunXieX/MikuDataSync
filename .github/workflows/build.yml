name: build

on:
  push:
    branches: [ main, "ci/**" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: miku-data-sync-jars
          path: |
            velocity/build/libs/*.jar
            paper/build/libs/*.jar
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: miku-data-sync-jars
          path: dist

      - name: Check tag matches build version
        run: |
          VER=$(grep -oP '^version=\K.*' gradle.properties)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VER" != "$TAG" ]; then
            echo "tag $TAG 与 gradle.properties 版本 $VER 不一致" >&2
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} 已存在，跳过发布。"
            exit 0
          fi
          shopt -s globstar nullglob
          JARS=(dist/**/*.jar)
          if [ ${#JARS[@]} -eq 0 ]; then
            echo "没有找到构建产物" >&2
            exit 1
          fi
          NOTES_FILE="$(mktemp)"
          git log -1 --format=%b HEAD > "${NOTES_FILE}"
          if [ -s "${NOTES_FILE}" ]; then
            gh release create "${GITHUB_REF_NAME}" "${JARS[@]}" \
              --title "${GITHUB_REF_NAME}" --notes-file "${NOTES_FILE}"
          else
            echo "发版提交正文为空，无法生成更新日志" >&2
            exit 1
          fi
